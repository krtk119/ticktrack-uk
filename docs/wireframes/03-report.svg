<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Wireframe of the report a sighting form">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">Wireframe 3 · Report a sighting: form, errors and result</text>
<rect x="24" y="56" width="560" height="640" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="44" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">Report a tick sighting</text>
<rect x="44" y="100" width="420" height="8" rx="4" fill="#d1d5db"/>
<rect x="44" y="120" width="520" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="60" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="start">Please fix the following:</text>
<text x="60" y="166" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#991b1b" text-anchor="start">• City: Choose the city where you saw the tick</text>
<text x="60" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#991b1b" text-anchor="start">• Species: Choose the species</text>
<text x="44" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Date seen *</text>
<rect x="44" y="230" width="250" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="314" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">City *  (only the city is stored)</text>
<rect x="314" y="230" width="250" height="30" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="314" y="280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#dc2626" text-anchor="start">Choose the city where you saw the tick</text>
<text x="44" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Species *</text>
<rect x="44" y="318" width="520" height="30" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="44" y="364" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#2563eb" text-anchor="start">Not sure? → identification guide</text>
<text x="44" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Notes (optional)</text>
<text x="564" y="396" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">0/500</text>
<rect x="44" y="404" width="520" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="44" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Photo (optional)</text>
<rect x="44" y="520" width="160" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="124" y="545" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Choose a photo</text>
<rect x="216" y="520" width="40" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="44" y="580" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">JPEG/PNG/WebP, up to 5 MB. Location data is removed.</text>
<rect x="44" y="606" width="150" height="36" rx="8" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
<text x="119" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Submit sighting</text>
<text x="210" y="629" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">Shown publicly as unverified. No account needed.</text>
<rect x="616" y="56" width="560" height="330" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="636" y="88" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">After submitting</text>
<rect x="636" y="104" width="520" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="652" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="start">✓ Thanks, your sighting has been saved</text>
<text x="652" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">Marsh tick in London on 31 Oct 2026. Shown on the map</text>
<text x="652" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">as an unverified community report.</text>
<rect x="636" y="196" width="520" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="652" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#92400e" text-anchor="start">⚠ This might be a duplicate</text>
<text x="652" y="244" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#92400e" text-anchor="start">Same species and city within a day. Still saved;</text>
<text x="652" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#92400e" text-anchor="start">just a flag. (A simple rule check, not AI.)</text>
<rect x="636" y="292" width="150" height="34" rx="8" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
<text x="711" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">See it on the map</text>
<rect x="796" y="292" width="190" height="34" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="891" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Report another sighting</text>
<rect x="616" y="404" width="560" height="292" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="636" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Design notes</text>
<text x="636" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">• Errors appear in a summary at the top (focus moves there, so screen</text>
<text x="636" y="486" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">  readers announce it) and next to each field. Each summary item links</text>
<text x="636" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">  to its field.</text>
<text x="636" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">• The browser checks fields instantly; the server checks again and its</text>
<text x="636" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">  field-level errors are shown the same way.</text>
<text x="636" y="582" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">• A possible duplicate is a warning, never a rejection.</text>
<text x="636" y="606" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">• Privacy is stated where it matters: city only, photo location removed,</text>
<text x="636" y="630" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">  no account.</text>
<text x="636" y="654" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">• Success leads straight to the new sighting on the map.</text>
</svg>
